<!DOCTYPE html>
<html>
<head> 
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/Japan-Phone-Codes-Quiz-Easy.css">
    <title>Phone Codes Quiz</title>
    <link rel="icon" href="SVG/favicon.svg" type="image/svg+xml">
</head>
<body>
<div id="mapContainer">
    <div id="map"></div>
    
    <div id=questionText class="background position-top-middle content-center"></div>

    <div id="legendBox" class="background">
        <div class="legendItem">
            <span class="colorBox correct"></span>
            <span>Correct</span>
        </div>

        <div class="legendItem">
            <span class="colorBox wrong"></span>
            <span>Wrong</span>
        </div>
    </div>
    <button id="continueButton" class="background hidden" onclick="buttonContinue()">
        Continue
        <div id="continueButtonNotice">
            spacebar
        </div>
    </button>
    <a id="homeButton" class="background container-top-right" href="index.html">↩</a>
    <a id="switchButton" class="background" href="phone-codes.html">Learning</a>
</div>

<script src="js/Japan-Phone-Codes-Quiz-Easy.js"></script>

</html>
