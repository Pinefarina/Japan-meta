<!DOCTYPE html>
<html>
<head> 
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/Japan-Phone-Codes-Quiz-Normal.css">
    <title>Phone Codes Quiz 3 Digit</title>
    <link rel="icon" href="SVG/favicon.svg" type="image/svg+xml">
</head>
<body>
<div id="mapContainer">
    <div id="map"></div>
    
    <div id=questionText class="background position-top-middle content-center"></div>

    <div>
        <div id="legendBox" class="background">
            <div class="legendItem">
                <span class="colorBox correct"></span>
                <span>Correct Answer</span>
            </div>

            <div class="legendItem">
                <span class="colorBox wrong"></span>
                <span>Wrong Answer</span>
            </div>

            <div class="legendItem">
                <span class="colorBox missing"></span>
                <span>Missing Answer</span>
            </div>
        </div>
        <div id="sliderWrapper" class="background">
            <p id="rangeText"></p>
            <div class="sliderContainer">
                <div class="sliderRange"></div>
                <input type="range" id="slider1" min="0" max="59" value="0">
                <input type="range" id="slider2" min="0" max="59" value="59">
            </div>
        </div>
    </div>
    <button id="continueButton" class="background hidden" onclick="buttonContinue()">
        Continue
        <div id="continueButtonNotice">
            spacebar
        </div>
    </button>
    <div class="container-top-right buttonContainer">
        <a class="defaultButton" href="phone-codes-quiz-hard.html">Quiz 3 Digit Hard</a>
        <a class="defaultButton" href="phone-codes-quiz-easy.html">Quiz 2 Digit</a>
        <a class="defaultButton" href="phone-codes.html">Learning</a>
        <a class="defaultButton" href="index.html">↩</a>
    </div>
</div>

<script src="js/Japan-Phone-Codes-Quiz-Normal.js"></script>

</body>
</html>
