<!DOCTYPE html>
<html>
<head> 
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/Japan-Prefectures.css">
    <title>Pefectures</title>
    <link rel="icon" href="SVG/favicon.svg" type="image/svg+xml">
</head>
<body>
<div id="mapContainer">
    <div id="map"></div>

    <div id="questionText" class="background position-top-middle content-center"></div>
    <div id="legendBox" class="background">
        <div class="legendItem">
            <span class="colorBox correct"></span>
            <span>Correct</span>
        </div>

        <div class="legendItem">
            <span class="colorBox wrong"></span>
            <span>Wrong</span>
        </div>
    </div>
    <button id="continueButton" class="background hidden" onclick="buttonContinue()">
        Continue
        <div id="continueButtonNotice">
            spacebar
        </div>
    </button>
    <div class="container-top-right buttonContainer">
        <a class="defaultButton" href="index.html">↩</a>
    </div>
</div>

<script src="js/Japan-Prefectures.js"></script>

</body>
</html>
